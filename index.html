<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cardápio Digital - Produtos e Combos</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="app-container">
    <!-- Header -->
    <div class="header">
      <div class="header-left">
        <div class="header-icon">🍔</div>
        <div>
          <div class="header-title">Cardápio Digital</div>
          <div class="header-subtitle">Gerencie produtos e combos</div>
        </div>
      </div>
      <div class="header-actions">
        <button class="btn btn-secondary btn-sm" onclick="app.exportData()">📥 Exportar</button>
        <button class="btn btn-secondary btn-sm" onclick="document.getElementById('importFile').click()">📤 Importar</button>
        <input type="file" id="importFile" accept=".json" style="display:none" onchange="app.importData(this)">
      </div>
    </div>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab active" onclick="app.setTab('products')" id="tab-products">
        🍟 Produtos <span class="tab-badge" id="badge-products">0</span>
      </button>
      <button class="tab" onclick="app.setTab('combos')" id="tab-combos">
        🎁 Combos <span class="tab-badge" id="badge-combos">0</span>
      </button>
    </div>

    <!-- Content -->
    <div class="content-card">
      <div class="content-header">
        <div>
          <div class="content-title" id="content-title">Produtos</div>
          <div class="content-count" id="content-count">0 itens cadastrados</div>
        </div>
        <div style="display:flex;align-items:center;gap:0.75rem;">
          <div class="search-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            <input type="text" id="searchInput" placeholder="Buscar..." oninput="app.search(this.value)">
          </div>
          <button class="btn btn-primary" onclick="app.openModal()" id="btn-add">
            <span>+</span> Novo Produto
          </button>
        </div>
      </div>

      <div class="product-list" id="productList"></div>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="modalOverlay" onclick="app.closeModal(event)">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-header">
        <div class="modal-title" id="modalTitle">Novo Produto</div>
        <button class="modal-close" onclick="app.closeModal()">&times;</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="app.closeModal()">Cancelar</button>
        <button class="btn btn-primary" onclick="app.save()" id="btnSave">Salvar</button>
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer"></div>

  <script src="js/app.js"></script>
</body>
</html>
